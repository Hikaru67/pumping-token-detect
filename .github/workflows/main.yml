name: Deploy to VPS via SSH

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # (Tùy chọn) Thêm bước copy code từ GitHub sang VPS ở đây nếu bạn không dùng git pull trên VPS.
      # Ví dụ dùng appleboy/scp-action...

      - name: Deploy and Reload PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_APP: ${{ vars.TARGET_APP }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }} # Thường là 22
          # Bắt buộc phải khai báo 'envs' để mang biến từ GitHub vào môi trường SSH
          envs: TARGET_APP 
          script: |
            # 1. DI CHUYỂN VÀO THƯ MỤC CHỨA CODE TRÊN VPS CỦA BẠN (Sửa lại đường dẫn này)
            cd /root/pumping-token-detect || exit 1

            # 2. NẠP NODE.JS VÀ PM2 VÀO MÔI TRƯỜNG (Cực kỳ quan trọng)
            export PATH="/root/.nvm/versions/node/v23.11.1/bin:$PATH"

            # 3. CẬP NHẬT CODE (Bỏ comment nếu bạn cần cập nhật code bằng git)
            git pull origin master
            npm install

            # 4. CHẠY LOGIC PM2
            TARGET_APPS="${TARGET_APP:-signal_token}"

            for app in $TARGET_APPS; do
              # Tránh lỗi output từ npm/nvm làm sai lệch kết quả kiểm tra của PM2 bằng cách lấy đường dẫn tuyệt đối của pm2 nếu cần (thường pm2 describe vẫn chạy tốt)
              if pm2 describe "$app" > /dev/null 2>&1; then
                echo "⚡ Đang reload app: $app"
                pm2 reload "$app" --update-env
              else
                echo "⚠️ App '$app' hiện chưa chạy trong PM2. Đang khởi động..."
                if [ "$app" = "pump-token-alert" ] || [ "$app" = "main" ]; then
                  # Vì đã cd vào đúng thư mục ở trên, nên lệnh này sẽ chạy đúng file main.js
                  pm2 start main.js --name "$app"
                  pm2 save
                fi
              fi
            done
