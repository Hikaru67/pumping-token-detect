- name: Deploy and Reload PM2
  # Cấu hình biến môi trường an toàn tại step này
  env:
    SECRET_APP_NAME: ${{ secrets.PM2_APP_NAME }}
  # BẮT BUỘC phải có dấu | ở đây để chạy script nhiều dòng
  run: |
    # Fallback về 'pump-token-alert' nếu secret bị rỗng
    TARGET_APPS="${SECRET_APP_NAME:-pump-token-alert}"
  
    for app in $TARGET_APPS; do
      if pm2 describe "$app" > /dev/null 2>&1; then
        echo "⚡ Đang reload app: $app"
        pm2 reload "$app" --update-env
      else
        echo "⚠️ App '$app' hiện chưa chạy trong PM2. Đang khởi động..."
        if [ "$app" = "pump-token-alert" ] || [ "$app" = "main" ]; then
          pm2 start main.js --name "$app"
          pm2 save
        fi
      fi
    done
